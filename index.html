<head>
<meta charset="UTF-8">

<title>Путь Великого Хана — историческая игра</title>
<meta name="description" content="Историческая игра: принимайте решения и следите за их влиянием на государство.">
<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    transition: background 1s ease;
}
#prologue {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
#introVideo {
    width: 100%;
    max-width: 360px;
    height: auto;
    border-radius: 12px;
    object-fit: contain;
    background: black;
    margin-bottom: 20px;
}
#eventImage{
    width:700px;
    height:400px;
    object-fit:cover;
    display:block;
    margin:20px auto;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.4);
    opacity:0;
    transition: opacity 1s ease;
}
#eventText{
    opacity:0;
    transition: opacity 1s ease;
}
button{
    padding:10px 20px;
    margin:10px;
    font-size:16px;
    cursor:pointer;
    transition: transform 0.2s, background 0.2s, opacity 0.5s ease;
    opacity:0;
}
button:hover{
    transform: scale(1.1);
    background: #444;
}
#stats{
    margin:20px;
    font-size:18px;
}
#fade{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.5s ease;
    z-index:999;
}
.fade-in{
    opacity:1 !important;
}
#stats, #eventImage, #eventText, #choices{
    display:none;
}

#prologue button { opacity: 1; }
#eventImage { max-width: calc(100vw - 32px); height: auto; aspect-ratio: 7/4; }
#eventText { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
#choices { max-width: 1200px; margin: 0 auto 24px; }
@media (max-width: 600px) {
  h1 { font-size: 26px; }
  #eventText { font-size: 21px; }
  #choices button { display: block; width: calc(100% - 32px); margin: 12px 16px; }
}

/* Readable decision feedback without changing the original visual theme. */
#stats {max-width:1100px;margin:20px auto;padding:0 16px;box-sizing:border-box;}
.chapter-progress {color:#e6c98c;font-size:16px;letter-spacing:.03em;}
.stat-grid {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;}
.stat-tile {background:#ffffff0c;border:1px solid #ffffff22;border-radius:10px;padding:12px 6px;}
.stat-tile span {display:block;color:#c9c9c9;font-size:14px;margin-bottom:6px;}
.stat-tile strong {font-size:19px;}
.stat-low {border-color:#e7a568;background:#6a291d55;}
.warning {color:#ffcb9d;line-height:1.5;font-size:16px;}
#eventText {font-size:23px;line-height:1.5;font-weight:500;}
#outcomePanel {max-width:1000px;margin:20px auto;padding:22px;box-sizing:border-box;background:#171b20;border:1px solid #b99a6066;border-radius:14px;text-align:left;line-height:1.65;font-size:18px;}
#outcomePanel[hidden] {display:none;}
#outcomePanel h3 {margin:0 0 12px;color:#e6c98c;font-size:21px;}
#outcomePanel p {margin:10px 0;}
#outcomePanel button {opacity:1;font-size:16px;}
#outcomePanel a {color:#e6c98c;overflow-wrap:anywhere;}
.selected-decision {color:#c4c9ce;font-size:16px;}
.effect-list {display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;}
.effect-list span {padding:6px 10px;border-radius:6px;background:#ffffff09;}
.effect-positive {color:#a6e2b2;}.effect-negative {color:#ffc097;}
.recovery-note,.story-note {font-size:15px;color:#bdc5ce;}
#choices button {opacity:1;white-space:normal;line-height:1.4;border:1px solid #ffffff38;border-radius:8px;background:#262d35;color:#fff;}
#choices button:hover {background:#354150;transform:translateY(-1px);}
#choices button:disabled {opacity:.5;cursor:default;transform:none;}
#choices .continue-button {background:#bfa16b;color:#171b20;font-weight:700;min-width:220px;}
button:focus-visible {outline:3px solid #e6c98c;outline-offset:3px;}
@media(max-width:650px){.stat-grid{grid-template-columns:repeat(3,minmax(0,1fr));}#outcomePanel{margin:16px;padding:16px;font-size:17px;}#eventText{font-size:20px;}#stats{padding:0 16px;}.stat-tile span{font-size:12px;}}

</style>
</head>

function appliedEffect(effect){
 const delta={};
 for(const [key,value] of Object.entries(effect||{})){
  const step=value<0?-Math.ceil(Math.abs(value)*0.55):Math.ceil(value*0.65);
  const before=stats[key];stats[key]=Math.max(0,Math.min(100,before+step));delta[key]=stats[key]-before;
 }
 return delta;
}

  const tile=document.createElement('div');tile.className='stat-tile'+(stats[key]<=20?' stat-low':'');
  const title=document.createElement('span');title.textContent=labels[key];
  const value=document.createElement('strong');value.textContent=stats[key]+' / 100';
  tile.appendChild(title);tile.appendChild(value);grid.appendChild(tile);
 }
 box.appendChild(grid);
 const low=lowStats();if(low.length){const w=document.createElement('p');w.className='warning';w.setAttribute('role','status');w.textContent='⚠ На исходе: '+low.map(k=>labels[k].toLowerCase()).join(', ')+'. Следующие потери могут привести к поражению. Воспользуйтесь советом или передышкой.';box.appendChild(w);}
}
function actionButton(text,callback){
 const b=document.createElement('button');b.textContent=text;b.style.opacity=1;
 b.onclick=()=>{if(b.disabled)return;b.disabled=true;callback();};return b;
}
function clearOutcome(){const panel=document.getElementById('outcomePanel');panel.hidden=true;panel.innerHTML='';}
function showRecovery(panel){
 const low=lowStats();if(!low.length||councilsUsed.has(currentPhase)||gameOver)return;
 panel.appendChild(actionButton('Созвать совет — восстановить ослабленные показатели',()=>{
  councilsUsed.add(currentPhase);
  const changes={};for(const key of low){const before=stats[key];stats[key]=Math.min(100,stats[key]+20);changes[key]=stats[key]-before;}
  const note=document.createElement('p');note.className='recovery-note';note.textContent='Совет перераспределил помощь: '+Object.entries(changes).map(([k,v])=>labels[k]+' +'+v).join(', ')+'. Такая помощь доступна один раз за этап.';
  panel.appendChild(note);updateStats();
 }));
}
function showOutcome(event,choice,delta,continuation){
 const panel=document.getElementById('outcomePanel');panel.innerHTML='';panel.hidden=false;
 const title=document.createElement('h3');title.textContent='Последствия решения';panel.appendChild(title);
 const selected=document.createElement('p');selected.className='selected-decision';selected.textContent='Ваш выбор: '+choice.text;panel.appendChild(selected);
 const description=document.createElement('p');description.textContent=choice.outcome||'Вы выбрали будущий курс государства. Итог определяется накопленными показателями и вашим последним решением.';panel.appendChild(description);
 const changes=document.createElement('div');changes.className='effect-list';
 const entries=Object.entries(delta).filter(([k,v])=>v!==0);
 if(!entries.length){const n=document.createElement('span');n.textContent='Показатели не изменились';changes.appendChild(n);}
 for(const [key,value] of entries){const chip=document.createElement('span');chip.className=value>0?'effect-positive':'effect-negative';chip.textContent=labels[key]+' '+(value>0?'+':'')+value;changes.appendChild(chip);}
 panel.appendChild(changes);
 const choices=document.getElementById('choices');choices.innerHTML='';
 pendingContinuation=continuation;
 if(!checkDefeat()){
  showRecovery(panel);
  const next=actionButton(choice.final?'Посмотреть итог':'Продолжить',()=>{
   if(!pendingContinuation)return;const resume=pendingContinuation;pendingContinuation=null;clearOutcome();resume();
  });next.className='continue-button';choices.appendChild(next);next.focus({preventScroll:true});
 }
}
function checkDefeat(){
 if(!Object.keys(labels).some(k=>stats[k]<=0))return false;
 gameOver=true;pendingContinuation=null;
 const p=document.createElement('p');p.className='warning';p.textContent='Государство пало. Истощены: '+Object.keys(labels).filter(k=>stats[k]<=0).map(k=>labels[k].toLowerCase()).join(', ')+'. Попробуйте сохранить баланс и воспользоваться помощью до истощения показателей.';
 document.getElementById('outcomePanel').appendChild(p);
 const choices=document.getElementById('choices');choices.innerHTML='';choices.appendChild(actionButton('Начать заново',()=>location.reload()));
 safePlay(document.getElementById('loseSound'));return true;
}
function loadEvent(event){
 const version=++renderVersion;currentEvent=event;decisionLocked=true;clearOutcome();
 const img=document.getElementById('eventImage');const text=document.getElementById('eventText');const choices=document.getElementById('choices');
 choices.innerHTML='';img.style.opacity=0;text.style.opacity=0;document.body.style.background=event.bgColor;updateStats();
 setTimeout(()=>{
  if(version!==renderVersion)return;
  img.src=event.image;img.alt=event.reconstruction?'Иллюстрация игрового эпизода':'Иллюстрация исторического сюжета';img.style.opacity=1;
  text.textContent=(event.reconstruction?'Игровой эпизод · ':'')+(typeof event.text==='function'?event.text():event.text);text.style.opacity=1;
  const cs=typeof event.choices==='function'?event.choices():event.choices;
  cs.forEach((choice,index)=>{
   const b=actionButton(choice.text,()=>{
    if(decisionLocked||gameOver)return;decisionLocked=true;
    for(const child of choices.children)child.disabled=true;
    safePlay(document.getElementById('clickSound'));
    memory[event.id]=index;
    if(choice.succession)successor=choice.succession;
    if(event.id==='war10'&&index===2)warReturn=true;
    if(!event.isCamp)decisionsMade++;
    const delta=appliedEffect(choice.effect);updateStats();
    showOutcome(event,choice,delta,()=>{
     if(choice.final){resolveEnding(choice);return;}
     if(!event.isCamp)currentStage++;
     loadNextEvent();
    });
   });choices.appendChild(b);
  });decisionLocked=false;
 },220);
}
function showCamp(){
 campsUsed.add(currentPhase);
 const key=currentPhase==='prologue'?'images/prologue3.jpg':currentPhase==='war'?'images/war1.jpg':'images/internal6.jpg';
 loadEvent({...scene('camp-'+currentPhase,'Путь продолжается. Перед следующими событиями можно устроить передышку, пополнить запас или сохранить темп. Это дополнительный игровой эпизод.',''+key,[
  option('Пополнить продовольственный запас',{resources:28,loyalty:-3},'Отряды занялись снабжением. Запас вырос; ожидание вызвало небольшое недовольство.'),
  option('Дать людям отдых и восстановить силы',{army:24,stability:12,resources:-4},'Отдых восстановил силы и порядок. На стоянке израсходована часть продовольствия.'),
  option('Продолжить без остановки',{},'Вы сохранили темп. Дополнительного восстановления не произошло.')
 ]),isCamp:true});
}
function showRouteChoice(){
 ++renderVersion;decisionLocked=false;clearOutcome();updateStats();
 document.getElementById('eventImage').src=embeddedAssets['images/unification10.jpg'];
 document.getElementById('eventText').textContent='Объединение завершено. Выберите главный путь';
 document.getElementById('eventText').style.opacity=1;document.getElementById('eventImage').style.opacity=1;
 const panel=document.getElementById('outcomePanel');panel.hidden=false;
 const note=document.createElement('p');note.textContent='В одном прохождении доступна одна ветка. Военные походы — 10 событий о внешних конфликтах и снабжении армии. Внутренняя политика — 10 событий об управлении, торговле и согласии. После выбранной ветки вас ждут 10 событий о наследии хана. Другой путь можно попробовать при новом прохождении.';panel.appendChild(note);
 const choices=document.getElementById('choices');choices.innerHTML='';
 for(const [value,label] of [['war','Военные походы'],['internal','Внутренняя политика']])choices.appendChild(actionButton(label,()=>{
  if(routeChosen)return;routeChosen=true;path=value;currentPhase=value;currentStage=0;
  stats.resources=Math.min(100,stats.resources+10);clearOutcome();loadNextEvent();
 }));
 const supplies=document.createElement('p');supplies.className='recovery-note';supplies.textContent='Перед новым этапом снабжение пополнит ресурсы на 10, но не выше 100.';panel.appendChild(supplies);
}
function loadNextEvent(){
 if(gameOver)return;
 const events=phaseEvents[currentPhase];
 if(currentStage>=events.length){
  if(currentPhase==='unification'){showRouteChoice();return;}
  if(currentPhase==='prologue'){currentPhase='unification';currentStage=0;loadNextEvent();return;}
  if(currentPhase==='war'||currentPhase==='internal'){currentPhase='final';currentStage=0;loadNextEvent();return;}
  return;
 }
 if(currentPhase!=='final'&&currentStage===Math.floor(events.length/2)&&!campsUsed.has(currentPhase)){showCamp();return;}
 loadEvent(events[currentStage]);
}
function resolveEnding(choice){
 // Specific final decisions take precedence over general low-stat endings.
 const ordered=choice.text==='Разделить на улусы'?[endings[5],...endings.filter((e,i)=>i!==5)]:endings;
 const ending=ordered.find(e=>e.condition(stats,choice,path));
 loadEnding(ending);safePlay(document.getElementById('winSound'));
}
function loadEnding(ending){
 ++renderVersion;gameOver=true;clearOutcome();
 const img=document.getElementById('eventImage');img.src=ending.image;img.style.opacity=1;
 document.getElementById('eventText').textContent=ending.text;
 document.getElementById('eventText').style.opacity=1;document.body.style.background=ending.bgColor;
 const panel=document.getElementById('outcomePanel');panel.hidden=false;
 const summary=document.createElement('p');summary.textContent='Ваш путь: '+(path==='war'?'военные походы':'внутренняя политика')+'. Принято сюжетных решений: '+decisionsMade+'. Это итог игровой модели, а не предсказание реальной истории.';panel.appendChild(summary);
 const history=document.createElement('p');history.className='story-note';history.textContent='Историческая справка: Чингисхан умер в 1227 году. Его преемник Угэдэй стал великим ханом в 1229 году. Альтернативные решения и пять дополнительных бытовых эпизодов в игре являются реконструкцией.';panel.appendChild(history);
 const source=document.createElement('a');source.href='https://afe.easia.columbia.edu/mongols/figures/figu_ogo.htm';source.target='_blank';source.rel='noopener noreferrer';source.textContent='Источник справки — Columbia University, Asia for Educators';panel.appendChild(source);
 const choices=document.getElementById('choices');choices.innerHTML='';choices.appendChild(actionButton('Начать заново и попробовать другой путь',()=>location.reload()));
}


// ПРОЛОГ
let video = document.getElementById("introVideo");
let fade = document.getElementById("fade");
function playVideo(){ safePlay(video); }
video.onended = startTransition;
function skipVideo(){ startTransition(); }
let transitionStarted = false;
async function exitPrologueFullscreen(){
  // Desktop Fullscreen API, including older Safari.
  try {
    if (document.fullscreenElement && document.exitFullscreen) {
      await document.exitFullscreen();
    } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
      await document.webkitExitFullscreen();
    }
  } catch (_) {
    // Keep the game usable if the browser has already left fullscreen.
  }
  // iPhone/iPad use a separate native video fullscreen player.
  try {
    if (video.webkitDisplayingFullscreen && video.webkitExitFullscreen) {
      video.webkitExitFullscreen();
    }
  } catch (_) {}
}
async function startTransition(){
  if (transitionStarted) return;
  transitionStarted = true;
  video.pause();
  await exitPrologueFullscreen();
  fade.style.transition = "opacity 0.3s ease";
  fade.classList.add("fade-in");
  setTimeout(() => {
    startGame();
    fade.classList.remove("fade-in");
  }, 300);
}
function startGame(){
  video.pause();
  video.currentTime = 0;
  document.getElementById("prologue").style.display = "none";
  document.getElementById("stats").style.display = "block";
  document.getElementById("eventImage").style.display = "block";
  document.getElementById("eventText").style.display = "block";
  document.getElementById("choices").style.display = "block";
  let bg = document.getElementById("bgMusic"); bg.volume = 0; safePlay(bg);
  let wind = document.getElementById("wind"); wind.volume = 0; safePlay(wind);
  fadeInAudio(bg, 0.6);
  fadeInAudio(wind, 0.4);
  updateStats();
  loadNextEvent();
}
function fadeInAudio(audio, target){
  let vol = 0;
  let interval = setInterval(() => {
    if(vol < target){ vol += 0.02; audio.volume = Math.min(vol, target); }
    else{ clearInterval(interval); }
  }, 100);
}
