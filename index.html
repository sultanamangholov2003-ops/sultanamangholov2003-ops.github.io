<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    transition: background 1s ease;
}
#prologue {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
#introVideo {
    width: 100%;
    max-width: 360px;
    height: auto;
    border-radius: 12px;
    object-fit: contain;
    background: black;
    margin-bottom: 20px;
}
#eventImage{
    width:700px;
    height:400px;
    object-fit:cover;
    display:block;
    margin:20px auto;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.4);
    opacity:0;
    transition: opacity 1s ease;
}
#eventText{
    opacity:0;
    transition: opacity 1s ease;
}
button{
    padding:10px 20px;
    margin:10px;
    font-size:16px;
    cursor:pointer;
    transition: transform 0.2s, background 0.2s, opacity 0.5s ease;
    opacity:0;
}
button:hover{
    transform: scale(1.1);
    background: #444;
}
#stats{
    margin:20px;
    font-size:18px;
}
#fade{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.5s ease;
    z-index:999;
}
.fade-in{
    opacity:1 !important;
}
#stats, #eventImage, #eventText, #choices{
    display:none;
}

#prologue button { opacity: 1; }
#eventImage { max-width: calc(100vw - 32px); height: auto; aspect-ratio: 7/4; }
#eventText { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
#choices { max-width: 1200px; margin: 0 auto 24px; }
@media (max-width: 600px) {
  h1 { font-size: 26px; }
  #eventText { font-size: 21px; }
  #choices button { display: block; width: calc(100% - 32px); margin: 12px 16px; }
}
</style>

function updateStats(){
  document.getElementById("stats").innerHTML =
    `Авторитет: ${stats.authority} |
    Лояльность: ${stats.loyalty} |
    Армия: ${stats.army} |
    Ресурсы: ${stats.resources} |
    Стабильность: ${stats.stability}`;
}

function applyEffect(effect){
  for(let key in effect){ stats[key] += effect[key]; }
}

function checkDefeat(){
  if(stats.authority <= 0 || stats.loyalty <= 0 || stats.army <= 0 || stats.resources <= 0 || stats.stability <= 0){
    document.getElementById("eventText").innerText = "Государство пало.";
    safePlay(document.getElementById("loseSound"));
    document.getElementById("choices").innerHTML = "";
    return true;
  }
  return false;
}

function loadEvent(event){
  event = {...event,
    text: typeof event.text === "function" ? event.text() : event.text,
    choices: typeof event.choices === "function" ? event.choices() : event.choices
  };
  const img = document.getElementById("eventImage");
  const text = document.getElementById("eventText");
  const choicesContainer = document.getElementById("choices");
  img.style.opacity = 0;
  text.style.opacity = 0;
  choicesContainer.innerHTML = "";
  document.body.style.background = event.bgColor;
  setTimeout(() => {
    img.src = event.image;
    text.innerText = event.text;
    img.style.opacity = 1;
    text.style.opacity = 1;
    event.choices.forEach((choice, index) => {
      let btn = document.createElement("button");
      btn.innerText = choice.text;
      btn.style.opacity = 0;
      btn.onmouseover = () => btn.style.background = "#555";
      btn.onmouseout = () => btn.style.background = "";
      btn.onclick = function(){
        safePlay(document.getElementById("clickSound"));
        if(choice.effect) applyEffect(choice.effect);
        updateStats();
        if(checkDefeat()) return;
        if(choice.final){
          resolveEnding(choice);
          return;
        }
        if(choice.next){
          if(choice.next === "unification"){
            currentPhase = "unification";
            currentStage = 0;
          } else if(choice.next === "war"){
            path = "war";
            currentPhase = "war";
            currentStage = 0;
          } else if(choice.next === "internal"){
            path = "internal";
            currentPhase = "internal";
            currentStage = 0;
          } else if(choice.next === "final"){
            currentPhase = "final";
            currentStage = 0;
          }
          loadNextEvent();
          return;
        }
        currentStage++;
        loadNextEvent();
      };
      setTimeout(() => { btn.style.opacity = 1; }, index * 300);
      choicesContainer.appendChild(btn);
    });
  }, 500);
}

function loadNextEvent(){
  let eventsArray;
  if(currentPhase === "prologue") eventsArray = prologueEvents;
  else if(currentPhase === "unification") eventsArray = unificationEvents;
  else if(currentPhase === "war") eventsArray = warEvents;
  else if(currentPhase === "internal") eventsArray = internalEvents;
  else if(currentPhase === "final") eventsArray = finalEvents;
  
  if(currentStage < eventsArray.length){
    loadEvent(eventsArray[currentStage]);
  } else {
    if(currentPhase !== "final"){
      if(currentPhase === "prologue") currentPhase = "unification";
      else if(currentPhase === "unification") {
        path = "internal";
        currentPhase = "internal";
      } else currentPhase = "final";
      currentStage = 0;
      loadNextEvent();
    }
  }
}

function resolveEnding(finalChoice){
  for(let ending of endings){
    if(ending.condition(stats, finalChoice, path)){
      loadEnding(ending);
      safePlay(document.getElementById("winSound"));
      return;
    }
  }
}

function loadEnding(ending){
  const img = document.getElementById("eventImage");
  const text = document.getElementById("eventText");
  const choicesContainer = document.getElementById("choices");
  img.style.opacity = 0;
  text.style.opacity = 0;
  choicesContainer.innerHTML = "";
  document.body.style.background = ending.bgColor;
  setTimeout(() => {
    img.src = ending.image;
    text.innerText = ending.text;
    img.style.opacity = 1;
    text.style.opacity = 1;
    let btn = document.createElement("button");
    btn.innerText = "Начать заново";
    btn.style.opacity = 0;
    btn.onclick = () => location.reload();
    setTimeout(() => {btn.style.opacity = 1;}, 300);
    choicesContainer.appendChild(btn);
  }, 500);
}

// ПРОЛОГ
let video = document.getElementById("introVideo");
let fade = document.getElementById("fade");
function playVideo(){ safePlay(video); }
video.onended = startTransition;
function skipVideo(){ startTransition(); }
let transitionStarted = false;
async function exitPrologueFullscreen(){
  // Desktop Fullscreen API, including older Safari.
  try {
    if (document.fullscreenElement && document.exitFullscreen) {
      await document.exitFullscreen();
    } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
      await document.webkitExitFullscreen();
    }
  } catch (_) {
    // Keep the game usable if the browser has already left fullscreen.
  }
  // iPhone/iPad use a separate native video fullscreen player.
  try {
    if (video.webkitDisplayingFullscreen && video.webkitExitFullscreen) {
      video.webkitExitFullscreen();
    }
  } catch (_) {}
}
async function startTransition(){
  if (transitionStarted) return;
  transitionStarted = true;
  video.pause();
  await exitPrologueFullscreen();
  fade.style.transition = "opacity 0.3s ease";
  fade.classList.add("fade-in");
  setTimeout(() => {
    startGame();
    fade.classList.remove("fade-in");
  }, 300);
}
function startGame(){
  video.pause();
  video.currentTime = 0;
  document.getElementById("prologue").style.display = "none";
  document.getElementById("stats").style.display = "block";
  document.getElementById("eventImage").style.display = "block";
  document.getElementById("eventText").style.display = "block";
  document.getElementById("choices").style.display = "block";
  let bg = document.getElementById("bgMusic"); bg.volume = 0; safePlay(bg);
  let wind = document.getElementById("wind"); wind.volume = 0; safePlay(wind);
  fadeInAudio(bg, 0.6);
  fadeInAudio(wind, 0.4);
  updateStats();
  loadNextEvent();
}
function fadeInAudio(audio, target){
  let vol = 0;
  let interval = setInterval(() => {
    if(vol < target){ vol += 0.02; audio.volume = Math.min(vol, target); }
    else{ clearInterval(interval); }
  }, 100);
}
